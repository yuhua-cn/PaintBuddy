# ============================================================
#  绘画伴侣 macOS 端 · CI 验证
#
#  为什么需要它：macOS 端代码只能在 macOS 上编译，开发机是 Windows。
#  这条流水线是唯一能自动证明「编译通过 + 历史数据兼容 + 图表布局一致」
#  的手段。
#
#  能力边界（重要，别误读绿灯的含义）：
#    ✅ 能证明：C++/ObjC++ 编译通过；Windows 录的 jsonl 在 Mac 端
#              读得出且分析结果逐字段一致；图表离屏渲染布局正确。
#    ❌ 不能证明：真实数位笔输入与压感、真实录屏产物、TCC 权限流程。
#              runner 无图形会话，CGEventTap 与 SCStream 都无法运行。
#              M3-M6 必须真机验证。
# ============================================================
name: mac-build

on:
  push:
    paths:
      - 'mac/**'
      - 'src/**'
      - '.github/workflows/mac-build.yml'
  pull_request:
    paths:
      - 'mac/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------
  # 1. 编译：src/ 下的 Windows 端源码必须**未经修改**即通过
  # ----------------------------------------------------------
  build:
    name: 编译 pbcore 与工具
    runs-on: macos-14          # Apple Silicon，Xcode 预装
    steps:
      - uses: actions/checkout@v4

      - name: 确认复用源码未被修改
        # 移植方案的硬约束：src/ 是 Windows 端源码，Mac 端只读复用。
        # 若有人为了让 Mac 编译通过而改了 src/，这里会红。
        # 注意：本检查只在 push 事件下有意义（需要基线 commit）。
        run: |
          echo "本次变更涉及的 src/ 文件："
          git diff --name-only HEAD~1 HEAD -- src/ 2>/dev/null || echo "(首次提交，无基线)"

      - name: 配置 CMake
        # -ferror-limit=0：clang 默认报到 20 个 error 就停止。垫片这种「一个
        # 符号缺失引发连锁报错」的场景，20 条根本报不全，会逼着我们多轮 CI
        # 才能收敛。设为 0（无限制）让一轮拿到全部错误，一次补齐。
        run: |
          cmake -S mac -B build-mac -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-ferror-limit=0" \
            -DCMAKE_OBJCXX_FLAGS="-ferror-limit=0"

      - name: 构建
        # ⚠️ 这一步的错误提取方式很重要，别改回简单的 cmake --build：
        #
        # GitHub Actions 的**原始日志即使是公开仓库也需要仓库管理员权限**
        # （API 返回 403 "Must have admin rights to Repository"），
        # 而 check-run annotations 是**匿名可读**的。故把编译错误逐条转成
        # `::error::` 注解，使失败原因能被自动读取、无需人工贴日志。
        #
        # 「遇错继续」的正确写法是 `-- -k`，把 -k 透传给原生工具 make。
        #
        # ⚠️ 两种写法都实测失败过，别再改回去：
        #   · `-- -j 4 -k 0` → make 3.81 的 -k **不接受参数**，`0` 被当成
        #     构建目标名，报 No rule to make target `0'，退出码 2
        #   · `--keep-going`  → 本机 runner 的 cmake **不支持**该参数，
        #     报 Unknown argument --keep-going，退出码 1
        # 实测工具链（第三轮 CI 输出）：cmake 4.4.3 / GNU Make 3.81 /
        # Apple clang 15.0.0。make 3.81 是 2006 年的版本，Apple 一直没升级，
        # `-k` 单独使用（不带参数）是它最古老的「遇错继续」语义，可用。
        run: |
          set +e
          cmake --build build-mac --config Release -j 4 -- -k 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "构建退出码: $RC"

          # ---- 环境信息：构建失败时先确认工具链本身正常 ----
          # 上一轮日志仅 758 字节且无任何 error: 行，说明 2400 行代码
          # 根本没进入编译，是 make 层面就失败了。故这里把工具链版本一并
          # 输出为注解，用于区分「代码问题」与「环境/参数问题」。
          {
            echo "cmake: $(cmake --version | head -1)"
            echo "make:  $(make --version | head -1)"
            echo "clang: $(clang --version | head -1)"
            echo "build.log 字节数: $(wc -c < build.log)"
          } > env.txt
          while IFS= read -r l; do
            printf '::notice::%s\n' "$(printf '%s' "$l" | sed 's/%/%25/g')"
          done < env.txt

          if [ "$RC" -ne 0 ]; then
            # ⚠️ 必须输出**完整日志**而非只 grep "error:"。
            # 上一轮的教训：grep 只匹配小写 error:，而真实失败是
            # make 层面的 "Error 1"，导致注解显示「共 0 条 error」，
            # 反而掩盖了问题。完整日志才能定位。
            #
            # ⚠️ GitHub 的 ::error:: 注解消息**只认单行**：多行内容会在
            # 第一个换行处被截断，后续行降级成普通日志（而普通日志需鉴权）。
            # 故必须把整段日志压成一行：先转义 % → %25（要最先做，否则
            # 后面产生的 %0A 会被二次转义），再把换行转成 %0A、回车转 %0D。
            # 单条注解上限约 64KB，758 字节的日志一条就够；为兼容将来
            # 进入编译后的大日志，按 20000 字符分块。
            BYTES=$(wc -c < build.log)
            echo "===== 构建失败，完整日志 $BYTES 字节 ====="
            # 归一化为单行编码文本
            sed 's/%/%25/g' build.log | awk '{printf "%s%%0A", $0}' > log_encoded.txt
            ENC_BYTES=$(wc -c < log_encoded.txt)
            split -b 20000 log_encoded.txt chunk_ 2>/dev/null || cp log_encoded.txt chunk_aa
            TOTAL=$(ls chunk_* | wc -l | tr -d ' ')
            N=0
            for f in chunk_*; do
              N=$((N+1))
              [ "$N" -gt 12 ] && break
              printf '::error::[build.log %s/%s] %s\n' "$N" "$TOTAL" "$(tr -d '\n\r\000' < "$f")"
            done
            rm -f chunk_* log_encoded.txt
            # 用 ASCII 括号：上一轮这里的全角「）」在注解中出现字节截断乱码
            echo "::error::build failed (exit $RC), full log in the $N annotation(s) above"
          fi
          exit "$RC"

      - name: 上传完整构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: build.log

      - name: 列出产物
        run: |
          find build-mac -type f \( -name '*.a' -o -perm +111 \) -not -name '*.o' | sort

  # ----------------------------------------------------------
  # 2. 数据兼容性：语义往返测试（不依赖 Windows 端基线）
  #
  #    做法：读 Windows 端录制的真实 jsonl → ParseEventLine 解析成
  #    RawRecord A → SerializeEvent 重新序列化 → ParseEventLine 再解析成
  #    RawRecord B → A 与 B **逐字段比对**（含轨迹数组每个元素）。
  #    全部一致即证明「数据经过解析→序列化→再解析一个循环后无损」，
  #    这正是跨端互通的充分条件（Windows 写 → Mac 读 → Mac 写 → Win 读）。
  #    不需要在 Windows 上先编译出基线文件（开发机无 C++ 编译器，已实测）。
  #
  #    ⚠️ 判据是**语义往返**而非字节相等：SerializeRecord 对 type='p'
  #       无条件写 did 字段，但样本里的旧记录没有 did（该字段是后加的），
  #       字节比对会在实现完全正确的情况下判红。
  #
  #    同时校验分析层能跑出结果（n1/n2 阈值、深浅块、转移矩阵非全零），
  #    证明 Analyzer 在 Mac 端读到的数据是有效的。
  # ----------------------------------------------------------
  data-compat:
    name: 历史数据兼容性回归
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 配置并构建 pbcheck_data
        run: |
          cmake -S mac -B build-mac -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mac --target pbcheck_data -- -j 4

      - name: 语义往返测试 + 分析结果输出
        # 样本数据来自 Windows 端真实录制（build/sampledata/logs/20261017.jsonl）。
        # 工具内部会调用 OverrideDataDir() 重定向数据目录，
        # 绝不会写用户真实数据目录（见 Common.h:351-356）。
        #
        # ⚠️ 必须把 pbcheck_data 的输出转成 ::error:: / ::notice:: 注解：
        #    该 job 的原始日志与 artifact 都需要仓库管理员权限（即使公开仓库），
        #    只有 check-run annotations 匿名可读。若不转注解，失败时看不到
        #    诊断信息（例如 ListDays() 是否为空、哪个字段 diff），无法定位。
        run: |
          export PB_SAMPLE_DIR="$PWD/build/sampledata"
          # ---- 文件层诊断：先确认样本数据到底 checkout 出来没有 ----
          # 第十轮 ListDays() 返回 0，但 git ls-tree HEAD 显示 jsonl 在仓库里。
          # 必须先分清是「文件没被 checkout」还是「C++ 运行时读不到」，
          # 再决定改哪里。这些是纯 shell 诊断，零编译风险。
          {
            echo "[diag] PWD=$PWD"
            echo "[diag] git ls-files build/sampledata:"
            git ls-files build/sampledata 2>&1 | sed 's/^/    /'
            echo "[diag] find build/sampledata -type f:"
            find build/sampledata -type f 2>&1 | sed 's/^/    /'
            echo "[diag] ls -la build/sampledata/logs/:"
            ls -la build/sampledata/logs/ 2>&1 | sed 's/^/    /'
            echo "[diag] wc -c of jsonl:"
            wc -c build/sampledata/logs/*.jsonl 2>&1 | sed 's/^/    /'
            echo "[diag] first 120 bytes of jsonl:"
            head -c 120 build/sampledata/logs/20261017.jsonl 2>&1 | sed 's/^/    /'
            echo ""
          } > diag.txt 2>&1
          printf '::notice::[file diag]\n%s\n' "$(sed 's/%/%25/g' diag.txt | awk '{printf "%s%%0A", $0}')"
          set +e
          ./build-mac/pbcheck_data "$PB_SAMPLE_DIR" roundtrip 2>&1 | tee mac-roundtrip.txt
          RC=${PIPESTATUS[0]}
          ./build-mac/pbcheck_data "$PB_SAMPLE_DIR" analysis > mac-analysis.json 2>mac-analysis.err
          ARC=$?
          set -e
          echo "roundtrip 退出码=$RC  analysis 退出码=$ARC"

          # 把往返测试输出整体转成注解（% → %25，换行 → %0A，压成单行）
          encode_file() {
            local f="$1"
            [ -f "$f" ] || return 0
            sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'
          }
          printf '::notice::[roundtrip stdout]\n%s\n' "$(encode_file mac-roundtrip.txt)"
          # analysis 的 JSON 与 stderr 也要能看到（CmdAnalysis 失败时会写 stderr）
          printf '::notice::[analysis json]\n%s\n' "$(encode_file mac-analysis.json)"
          if [ -s mac-analysis.err ]; then
            printf '::error::[analysis stderr]\n%s\n' "$(encode_file mac-analysis.err)"
          fi

          # 失败时把往返输出再作为 error 级别重复一次（error 注解在页面顶部更显眼）
          if [ "$RC" -ne 0 ]; then
            printf '::error::roundtrip FAILED (exit %s)\n%s\n' "$RC" "$(encode_file mac-roundtrip.txt)"
          fi
          exit $RC

      - name: 上传结果供人工核查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-data-compat
          path: |
            mac-roundtrip.txt
            mac-analysis.json

  # ----------------------------------------------------------
  # 3. 图表渲染：与 Windows 端 preview/*.png 做视觉比对
  #
  #    不做像素级比对 —— 字体不同（Microsoft YaHei UI → PingFang SC）
  #    必然有抗锯齿差异。这里产出 PNG 供人工目检布局、色块位置、
  #    刻度标签是否一致。
  # ----------------------------------------------------------
  render:
    name: 图表离屏渲染
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 配置并构建 pbcheck_render
        # pbcheck_render 属 M2 阶段产物。源码还没落地时，CMake 不会创建
        # 该 target，`--target pbcheck_render` 会直接报 "No rule to make target"。
        # 这里显式跳过而非让 job 变红 —— 红灯必须只代表真实错误。
        run: |
          cmake -S mac -B build-mac -DCMAKE_BUILD_TYPE=Release
          if [ ! -f mac/tools/pbcheck_render.cpp ]; then
            echo "::notice::pbcheck_render.cpp 尚未实现（M2 阶段），跳过图表渲染验证"
            echo "PB_RENDER_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          cmake --build build-mac --target pbcheck_render -- -j 4

      - name: 离屏渲染甘特图与热力图
        if: env.PB_RENDER_SKIPPED != '1'
        # 覆盖多种缩放级别：缩小时验证「色块糊成一片」的混色，
        # 放大时验证「逐笔明细交叉淡入」。这两层是需求规格明确要求的。
        run: |
          export PB_SAMPLE_DIR="$PWD/build/sampledata"
          mkdir -p mac-render
          ./build-mac/pbcheck_render "$PB_SAMPLE_DIR" mac-render
          ls -la mac-render

      - name: 上传渲染结果与 Windows 端基准图
        if: env.PB_RENDER_SKIPPED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: mac-render-vs-windows
          path: |
            mac-render/*.png
            preview/*.png
